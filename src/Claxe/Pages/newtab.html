<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yeni Sekme</title>
    <!-- Phase 1 placeholder. The real new tab page (search, clock, shortcuts) comes in Phase 2. -->
    <style>
        :root { color-scheme: dark; }
        html, body { height: 100%; margin: 0; }
        body {
            display: grid;
            place-items: center;
            background: radial-gradient(ellipse at 50% 35%, #1d1530 0%, #0e0c13 65%);
            color: #ece8f5;
            font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif;
            user-select: none;
        }
        .mark { text-align: center; }
        h1 {
            margin: 0;
            font-size: 64px;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: #a77bff;
            text-shadow: 0 0 28px rgba(167, 123, 255, 0.35);
        }
        p { margin: 10px 0 0; color: #9a92b0; font-size: 15px; }
    </style>
</head>
<body>
    <div class="mark">
        <h1>CLAXE</h1>
        <p>Yukarıdaki adres çubuğuna bir adres veya arama yaz.</p>
    </div>
</body>
</html>
